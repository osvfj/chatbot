packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  electron-winstaller: set this to true or false
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false

minimumReleaseAgeExclude:
  - lucide-react@1.31.0
  - sonner@2.0.8

onlyBuiltDependencies:
  - "@effect/language-service"
  - "electron"
  - "electron-winstaller"
  - "esbuild"
  - "msgpackr-extract"
