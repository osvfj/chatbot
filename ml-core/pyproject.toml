[project]
name = "ml-core"
version = "0.1.0"
description = "Núcleo de razonamiento clásico de Cafebot: búsqueda, reglas, PLN, clasificadores y aprendizaje por refuerzo."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "scikit-learn==1.6.1",
  "numpy>=1.26",
  "joblib>=1.4",
  "spacy>=3.7",
  "es-core-news-sm @ file:///C:/Users/osvfj/Documents/projects/chatbot/ml-core/vendor/es_core_news_sm-3.8.0-py3-none-any.whl",
  "pysentimiento>=0.7",
  "httpx>=0.27",
  "networkx>=3.3",
  "PyJWT>=2.9",
  "bcrypt>=4.2",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "pandas>=2.2",
  "kagglehub>=0.3",
]

[project.scripts]
ml-core = "ml_core.server:main"
ml-core-train-vision = "ml_core.vision.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_core"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
